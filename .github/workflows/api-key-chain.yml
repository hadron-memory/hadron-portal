name: Synthetic API-key chain
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api-key-chain:
    # #1285: Playwright 1.58.2 cannot install Chromium on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portal
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: portal
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: hadron-memory/hadron-server
          ref: 1441992a407fe70c0e60f868ba1b0b32113ffb9a # tests/e2e/server-revision.txt
          path: server-fixture
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: corepack pnpm install --frozen-lockfile
        working-directory: server-fixture
      - run: corepack pnpm db:generate
        working-directory: server-fixture
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # No artifact upload: the fixture intentionally never records screenshots,
      # traces, cookies, page HTML, request bodies or raw credential diagnostics.
      - run: pnpm test:api-key-chain
        env:
          HADRON_E2E_SERVER_DIR: ${{ github.workspace }}/server-fixture
          HADRON_E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
