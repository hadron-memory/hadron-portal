name: Synthetic API-key chain
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api-key-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: hadron-memory/hadron-server
          ref: 812b4facd20773932b5e10fa3ddb4d3e9ac3e3a9 # tests/e2e/server-revision.txt
          path: .e2e-server
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: corepack pnpm install --frozen-lockfile
        working-directory: .e2e-server
      - run: corepack pnpm db:generate
        working-directory: .e2e-server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - run: pnpm exec svelte-kit sync
      - run: pnpm exec playwright install --with-deps chromium
      # No artifact upload: the fixture intentionally never records screenshots,
      # traces, cookies, page HTML, request bodies or raw credential diagnostics.
      - run: pnpm test:api-key-chain
        env:
          HADRON_E2E_SERVER_DIR: ${{ github.workspace }}/.e2e-server
          HADRON_E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
