name: CI

# The gate that runs the app: tests, type/svelte check, and a production build.
# Closes #693.
#
# Before this existed, none of the three workflows in this directory executed
# the app at all — `no-station-refs` is a git grep, `graphql-validate` checks
# documents against the schema snapshot (and runs vitest over `scripts/` only),
# and `schema-drift` is a nightly cross-repo SDL re-export. A PR could break
# every test in the suite, or stop compiling, and every check would still be
# green. Seven PRs merged on 2026-08-17/18 reported "CI green" truthfully and
# far more weakly than it sounded.
#
# This buys VISIBILITY, not enforcement: no repo in the hadron-memory org has a
# required status check (branch protection is unavailable on the org's plan for
# the private repos), so a red run does not block a merge — whoever merges still
# has to read the conclusions. See
# hrn:node:hadronmemory.com:dev:findings:ci-checks-are-advisory-no-required-gates
#
# `graphql-validate` deliberately stays a separate workflow: it is a contract
# check paired with the nightly `schema-drift`, and keeping that pairing legible
# is worth one extra dependency install. Its `pnpm vitest run scripts/` step is
# now a subset of `pnpm test` here (vitest.config.ts includes `scripts/`), which
# is redundant on purpose — that workflow stays self-contained so the gate's own
# tests run even if this file changes.
#
# Third-party actions are pinned to a full commit SHA (tag in a trailing
# comment), matching `graphql-validate` and `schema-drift`. Bump SHA + comment
# together when upgrading.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    # #1285: Playwright 1.58.2 cannot install Chromium on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      # corepack honours the `packageManager` field in package.json, so the
      # pnpm version stays pinned in one place.
      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsconfig.json extends ./.svelte-kit/tsconfig.json, which `svelte-kit
      # sync` generates and which is not committed. Without it vitest cannot
      # transform any .ts test and every test FILE fails to load — verified by
      # removing the directory on main: 81 files failed, 0 tests ran. It passes
      # locally only because an earlier `pnpm check` or `pnpm build` left the
      # directory behind, so the suite has never run in a clean environment.
      #
      # `pnpm check` and `pnpm build` both sync on their own; `pnpm test` is the
      # one that does not. This step stays explicit rather than being satisfied
      # by reordering the steps below it — a test run that depends on a previous
      # command's side effect is the exact bug this comment describes.
      - name: Generate the SvelteKit tsconfig
        run: pnpm exec svelte-kit sync

      - name: Test
        run: pnpm test

      # #854: jsdom cannot measure flexbox or document overflow. This fixture
      # uses the compiled app CSS and actual Urn component, without an API/DB.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check team chat chip target sizes
        run: pnpm test:team-chat-chips-layout

      - name: Check node phone layout
        run: pnpm test:node-phone-layout

      - name: Check memory Usage toolbar phone layout
        run: pnpm test:usage-toolbar-layout

      # portal#1826: the Org Integrations Add/select/Configure row at 390px.
      - name: Check Org Integrations add-row phone layout
        run: pnpm test:org-integrations-row-layout

      # portal#2082: the conversation panel's Save, Clear and Save goals controls.
      - name: Check conversation panel button layout
        run: pnpm test:conversation-panel-buttons-layout

      # portal#1099: the Tickers views at 390px and 1280px.
      - name: Check Tickers phone layout
        run: pnpm test:tickers-layout

      # portal#1315 (#1058/#1307): the NodeList search filter in real Chromium.
      - name: Check NodeList search
        run: pnpm test:node-list-search

      # portal#1619: the Task integrations heading paints a focus ring after a keyboard Cancel.
      - name: Check Task integrations focus ring
        run: pnpm test:task-integrations-focus

      # portal#1675: the ApplyAgentTickers result region paints a focus ring after a keyboard apply.
      - name: Check ApplyAgentTickers focus ring
        run: pnpm test:apply-agent-tickers-focus

      # portal#1676: Task integrations' touch targets and overflow at 390px and 1280px.
      - name: Check Task integrations layout
        run: pnpm test:task-integrations-layout

      # portal#1756: real App/worker prompt components at 390px and 1280px;
      # synthetic transport only, including a concealed ID that must never render.
      - name: Check boot prompt layout and concealed provenance
        run: pnpm test:boot-install-layout

      # portal#1686: every compact Urn call-site configuration in real Chromium.
      - name: Check compact URN keyboard and touch layout
        run: pnpm test:urn-compact-layout

      # portal#1711: the TaskHistory link values — touch targets, wrapping and
      # overflow at 390px and 1280px, in real Chromium with compiled CSS.
      - name: Check TaskHistory link layout
        run: pnpm test:task-history-links-layout

      # portal#1700: the Nodes tab reads one bounded page per action and keeps its DOM windowed (real Chromium).
      - name: Check Nodes tab lazy reads
        run: pnpm test:nodes-tab-lazy

      - name: Check shared tab-row overflow and keyboard layout
        run: pnpm test:tab-row-layout

      - name: Check opt-in table cell paint and interactive minima
        run: pnpm test:table-cell-overflow-layout

      - name: Check compact terminal containment
        run: pnpm test:terminal-status-layout
        env:
          TERMINAL_SHOTS: test-results/terminal-status

      - name: Upload terminal containment screenshots and geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-status-layout
          path: test-results/terminal-status
          if-no-files-found: ignore

      - name: Check App Runs table layout
        run: pnpm test:app-runs-layout

      - name: Check disabled AI config row menu pointer access
        run: pnpm test:ai-config-row-menu

      - name: Check AI config sign-in recovery navigation
        run: pnpm test:ai-config-signin-recovery

      - name: Check invitation clipboard feedback
        run: pnpm test:invite-copy

      - name: Check App picker phone layout
        run: node scripts/test-select-app-layout.mjs

      # portal#1590: SelectMemory stacked over SelectNode stays clear of the node dialog's header.
      - name: Check stacked memory picker layout
        run: pnpm test:stacked-memory-layout

      # #1932: full-graph Check exceeded the hosted ~2 GiB default. The
      # measured 4 GiB bound is Check-only; its preload reports sampled heap
      # and process peak RSS in the job summary; either warns above 75%
      # of the heap budget (RSS is conservative and includes native memory).
      # No files/diagnostics are excluded; failure still fails this step.
      - name: Check
        run: pnpm check

      # portal#1985/#2035: configured keys become required in generated
      # ambient types. Pin every key shipped in the documented setup, plus
      # the no-.env control above. Check is static; nothing is contacted.
      # Remove the synthetic env before the environment-free Build.
      - name: Check with documented .env
        run: |
          cp .env.example .env
          pnpm check
          rm .env

      # adapter-node, and every `$env` import is `$env/dynamic/*` (resolved at
      # runtime), so the build needs no environment variables. Verified with
      # `.env` moved aside.
      # #895: the build needs ~2 GB of main-thread heap, which is Node's default
      # limit here, so it failed whenever the runner was busy. The `build`
      # script grants 4 GB and reports its peak (scripts/build-heap-peak.mjs)
      # into this job's summary, with a warning past 75% of the limit.
      - name: Build
        run: pnpm build
