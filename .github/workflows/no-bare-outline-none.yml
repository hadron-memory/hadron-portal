# #1745 — fail on a bare `outline-none` beside `focus-visible:outline-*`.
#
# Tailwind 4's `outline-none` sets `--tw-outline-style: none`, and every
# `outline-*` utility draws with `outline-style: var(--tw-outline-style)`. When
# one element carries both, the computed outline style on `:focus-visible` stays
# `none` and the focus ring never paints — the a11y intent of the class list is
# silently inverted. It shipped twice (#1619: the Task integrations heading;
# #1675: the ApplyAgentTickers result region), and jsdom cannot see it (it
# computes no Tailwind cascade), so both times every component test stayed green.
# The Chromium focus probes pin the two fixed surfaces; this gate stops the NEXT
# one at the spelling, anywhere in `src/`.
#
# Shaped like `safe-interpolation`, `grid-filters` and `no-bare-loc-citations`:
# a small, app-independent gate in its own job so it reports separately from
# `ci`. It checks the tree as it stands, not the diff — the whole tree is clean
# as of #1745, so a file that regresses is caught even if the offending line was
# not the one touched.
name: no-bare-outline-none

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-bare-outline-none:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: A bare outline-none must not sit beside focus-visible outline utilities
        run: node scripts/check-outline-none.mjs
