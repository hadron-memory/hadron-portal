name: No Station Refs

# Per spec 003-station-to-app, Phase 4: the legacy `Station` /
# `stationId` / `station_id` identifiers were retired. This gate fails
# the build if any non-test source file mentions them again.
#
# Excludes:
#   - `**/*.test.ts(x)` — test files reference `Station` only when
#     covering the migration's own behavior.
#   - `**/__fixtures__/**` — historical fixture data may still mention
#     it for replay scenarios.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  no-station-refs:
    # PR jobs run on the orca1 self-hosted runner only while the repo variable PORTAL_SELF_HOSTED is 'true'
    # (hadron-server proposals:orca1-self-hosted-runner-portal); otherwise, and for pushes to main, ubuntu-latest.
    runs-on: ${{ github.event_name == 'pull_request' && vars.PORTAL_SELF_HOSTED == 'true' && fromJSON('["self-hosted","orca1-portal"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: git grep — Station / stationId / station_id in src/
        run: |
          set +e
          MATCHES=$(git grep -nE '\bStation\b|\bstationId\b|\bstation_id\b' -- \
            'src/' \
            ':!**/*.test.ts' \
            ':!**/*.test.tsx' \
            ':!**/__fixtures__/**')
          set -e
          if [ -n "$MATCHES" ]; then
            echo "::error::Found Station references in src/ (Phase 4 of spec 003-station-to-app retired this terminology):"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK — no Station references in src/."
