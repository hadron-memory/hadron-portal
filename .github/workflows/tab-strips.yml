# #858 — a tab strip in the narrow content column must scroll, not push the
# page off a phone screen. PR #746 fixed this on one page; #854 found it on
# another months later; #859 fixed four more. Two instances of one class across
# a gap of months is the argument for a gate rather than a third fix.
name: tab-strips

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tab-strips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The gate PARSES the Svelte AST rather than grepping source — which is
      # the whole reason it can answer "which element scrolls" — so it needs
      # svelte installed. That is also why this job installs where the
      # grep-based gates do not.
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Named for what it CHECKS, not for what a green run would like to mean,
      # and the name has been wrong twice for two different reasons:
      #   - "Every tab strip scrolls" overstated COVERAGE. This predicate
      #     recognises 13 of the 20 rails in src/. The other seven are not
      #     strips at all — no `border-b-2` children — but the job cannot say
      #     so about a file it has not been taught to parse, and it has been
      #     taught three times now (#858).
      #   - "…all scroll" overstated the REMEDY. A `flex flex-wrap` strip passes
      #     without scrolling, so the agent sub-tab bar is a green strip that
      #     does not scroll at all.
      # What the job actually proves is that the strips it can parse do not
      # overflow a phone screen. Say that.
      - name: Parsed tab strips do not overflow a phone screen
        run: node scripts/check-tab-strips.mjs
