installed: []
settings:
  auto_execute_hooks: true
hooks:
  before_constitution:
    - extension: git
      command: speckit.git.initialize
      enabled: true
      optional: false
      prompt: Execute speckit.git.initialize?
      description: Initialize Git repository before constitution setup
      condition: null
  before_specify:
    - extension: git
      command: speckit.git.feature
      enabled: true
      optional: false
      prompt: Execute speckit.git.feature?
      description: Create feature branch before specification
      condition: null
    - extension: hadron
      command: speckit.hadron.recall
      enabled: true
      optional: true
      prompt: Recall relevant prior knowledge from Hadron memory before specifying?
      description: Surface decisions, conventions, and gotchas from Hadron before /speckit-specify
      condition: null
  before_clarify:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit outstanding changes before clarification?
      description: Auto-commit before spec clarification
      condition: null
  before_plan:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit outstanding changes before planning?
      description: Auto-commit before implementation planning
      condition: null
  before_tasks:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit outstanding changes before task generation?
      description: Auto-commit before task generation
      condition: null
  before_implement:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit outstanding changes before implementation?
      description: Auto-commit before implementation
      condition: null
  before_checklist:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit outstanding changes before checklist?
      description: Auto-commit before checklist generation
      condition: null
  before_analyze:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit outstanding changes before analysis?
      description: Auto-commit before analysis
      condition: null
  before_taskstoissues:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit outstanding changes before issue sync?
      description: Auto-commit before tasks-to-issues conversion
      condition: null
  after_constitution:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit constitution changes?
      description: Auto-commit after constitution update
      condition: null
  after_specify:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit specification changes?
      description: Auto-commit after specification
      condition: null
  after_clarify:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit clarification changes?
      description: Auto-commit after spec clarification
      condition: null
  after_plan:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit plan changes?
      description: Auto-commit after implementation planning
      condition: null
  after_tasks:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit task changes?
      description: Auto-commit after task generation
      condition: null
  after_implement:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit implementation changes?
      description: Auto-commit after implementation
      condition: null
    - extension: hadron
      command: speckit.hadron.review
      enabled: true
      optional: true
      prompt: Run the implementation diff against Hadron review-criteria nodes?
      description: Apply project-specific review criteria stored in Hadron memory
      condition: null
    - extension: hadron
      command: speckit.hadron.capture
      enabled: true
      optional: true
      prompt: Capture what was learned in this spec back into Hadron memory?
      description: Save new knowledge and corrections via h-add-node / h-update-node — runs after review
      condition: null
  after_checklist:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit checklist changes?
      description: Auto-commit after checklist generation
      condition: null
  after_analyze:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit analysis results?
      description: Auto-commit after analysis
      condition: null
  after_taskstoissues:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit after syncing issues?
      description: Auto-commit after tasks-to-issues conversion
      condition: null
  before_finalize:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit outstanding changes before finalizing the spec?
      description: Auto-commit before finalize
      condition: null
  after_finalize:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit any cleanup changes from finalize?
      description: Auto-commit after finalize
      condition: null
