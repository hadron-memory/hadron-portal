schema_version: "1.0"

extension:
  id: hadron
  name: "Hadron Memory Integration"
  version: "0.1.0"
  description: "Recall, review, and capture institutional knowledge in the Hadron Graph at Spec Kit hook points."
  author: hadron-memory
  repository: https://github.com/hadron-memory/spec-kits
  license: MIT

requires:
  speckit_version: ">=0.2.0"
  tools:
    - name: hadron-mcp
      required: true
      description: "Hadron MCP server (hadron_find_nodes, hadron_get_node, hadron_create_node, hadron_update_node) must be configured for the agent."

provides:
  commands:
    - name: speckit.hadron.recall
      file: commands/speckit.hadron.recall.md
      description: "Surface relevant prior knowledge from Hadron memory before specifying."
    - name: speckit.hadron.review
      file: commands/speckit.hadron.review.md
      description: "Apply project review-criteria nodes from Hadron memory to the implementation diff."
    - name: speckit.hadron.capture
      file: commands/speckit.hadron.capture.md
      description: "Capture new knowledge and corrections back into Hadron memory. Phase-agnostic — runs at after_plan (research-phase findings) and after_implement (implementation-phase findings)."

# Recommended hook bindings — INTENTIONALLY MINIMAL.
#
# The extension.yml schema is one command per event, which cannot express the
# full Hadron binding shape — speckit.hadron.capture binds at TWO events
# (after_plan + after_implement), and after_implement holds two Hadron commands
# (review + capture). This block lists one canonical command per event as a
# pointer; do NOT copy it verbatim into your `.specify/extensions.yml`.
#
# The complete recommended bindings are:
#   - emitted by `extensions/hadron/install.sh` (this directory), printed for
#     manual paste into your `.specify/extensions.yml`, and
#   - documented in this extension's README.md.
#
# Notes:
#   - speckit.hadron.capture is mandatory (`optional: false`) at both events
#     so Spec Kit auto-executes it. Two captures with fresher context each
#     beats one end-of-session pass that has to remember everything.
#   - Under after_implement, speckit.hadron.review runs before
#     speckit.hadron.capture so capture reflects what actually shipped.
hooks:
  before_specify:
    command: speckit.hadron.recall
    optional: true
    prompt: "Recall relevant prior knowledge from Hadron memory before specifying?"
    description: "Surface decisions, conventions, and gotchas from Hadron before /speckit-specify"
  after_plan:
    command: speckit.hadron.capture
    optional: false
    prompt: "Capture research findings from this plan into Hadron memory?"
    description: "Save research-phase learnings (codebase recon, decisions, conventions) via hadron_create_node / hadron_update_node"
  after_implement:
    command: speckit.hadron.review
    optional: true
    prompt: "Run the implementation diff against Hadron review-criteria nodes?"
    description: "Apply project-specific review criteria stored in Hadron memory"

tags:
  - "memory"
  - "knowledge"
  - "hadron"
